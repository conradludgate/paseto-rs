name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check --all

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy

  test:
    # Keep a GCC 13 default for the locked AWS-LC FIPS module.
    runs-on: ubuntu-24.04
    name: tests
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo test --no-default-features
      - run: cargo test -p paseto-v1 --all-features
      - run: cargo test -p paseto-v2 --all-features
      - run: cargo test -p paseto-v3 --all-features
      - name: Test AWS-LC non-FIPS
        run: |
          cargo test -p paseto-v3-aws-lc --features zeroize,non-fips
          cargo test -p paseto-test --features paseto-v3-aws-lc/zeroize,paseto-v3-aws-lc/non-fips -- paseto-v3-aws-lc
      - name: Test AWS-LC FIPS
        run: |
          cargo test -p paseto-v3-aws-lc --features zeroize,fips
          cargo test -p paseto-test --features paseto-v3-aws-lc/zeroize,paseto-v3-aws-lc/fips -- paseto-v3-aws-lc
      - run: cargo test -p paseto-v4 --all-features
      - run: cargo test -p paseto-v5 --all-features
      - run: cargo test -p paseto-v6 --all-features

  bench:
    runs-on: ubuntu-latest
    name: benchmarks
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: cargo bench
